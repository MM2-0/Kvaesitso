name: Validate embedded Amethyst library
on:
  push:
    branches: ['codex/aether-amethyst-embedded']
  pull_request:
    paths:
      - 'libs/amethyst/**'
      - 'app/app/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/aether/**'
      - 'settings.gradle.kts'
      - '.github/workflows/validate-aether.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Compile full embedded client and run Android host tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -p libs/amethyst :amethyst:assembleFdroidDebug :amethyst:testFdroidDebugUnitTest \
            --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' 2>&1 | tee /tmp/aether-build.log
      - name: Publish concise failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          log = Path('/tmp/aether-build.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else ['Build log unavailable']
          selected = [line for line in lines if line.startswith('e: ') or 'Could not resolve' in line or 'Could not find ' in line]
          for line in (selected[-25:] or lines[-30:]):
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Aether library build::{escaped}')
          PYCODE
      - name: Report executed tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('libs/amethyst/amethyst/build/test-results/testFdroidDebugUnitTest').glob('TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in files:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          if not totals['tests']:
              raise SystemExit('No Aether host tests executed')
          print('::notice title=Aether host test totals::' + ', '.join(f'{key}={value}' for key, value in totals.items()))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-library-validation
          if-no-files-found: ignore
          path: |
            /tmp/aether-build.log
            libs/amethyst/amethyst/build/reports/tests/
            libs/amethyst/amethyst/build/test-results/

  telos-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v7
        with:
          go-version-file: libs/appops-next/daemon/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Compile the actual Telos APK with Aether embedded
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:app:assembleDefaultDebug -Ptelos.abi=arm64-v8a \
            --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' 2>&1 | tee /tmp/telos-aether-build.log
      - name: Validate production shrinking and Dokka security graph
        run: |
          set -o pipefail
          ./gradlew :app:app:assembleDefaultRelease -Ptelos.abi=arm64-v8a \
            --no-daemon --max-workers=1 --console=plain -Dorg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' 2>&1 | tee -a /tmp/telos-aether-build.log
          ./gradlew -I tools/validation/security-dependencies.init.gradle verifyDokkaSecurityDependencies \
            --no-configuration-cache --no-daemon --max-workers=1 --console=plain
      - name: Report compilation failures
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          log = Path('/tmp/telos-aether-build.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else ['No build log']
          selected = [line for line in lines if line.startswith('e: ') or 'Could not resolve' in line or 'Could not find ' in line or 'Error:' in line]
          print('::error title=Telos Aether failure details::' + '\n'.join(lines[-85:])[-18000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          for line in (selected[-30:] or lines[-30:]):
              print('::error title=Telos Aether compile::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telos-aether-build-validation
          if-no-files-found: ignore
          path: /tmp/telos-aether-build.log

  aether-storage-device:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Compile storage device tests
        run: |
          set -o pipefail
          ./gradlew -p libs/amethyst :amethyst:assembleFdroidDebugAndroidTest \
            --no-daemon --max-workers=1 --console=plain \
            -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' 2>&1 | tee /tmp/aether-storage-build.log
      - name: Report storage compilation errors
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          log = Path('/tmp/aether-storage-build.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          errors = [x for x in lines if x.startswith('e: ') or 'Could not resolve' in x]
          for line in (errors[-20:] or lines[-20:]):
              print('::error title=Aether device build::' + line.replace('%', '%25'))
          PYCODE
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew -p libs/amethyst :amethyst:connectedFdroidDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.vitorpamplona.amethyst.AetherStorageContextTest
            --no-daemon --max-workers=1 --console=plain -Dorg.gradle.parallel=false
            -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-storage-device-results
          if-no-files-found: ignore
          path: |
            libs/amethyst/amethyst/build/outputs/androidTest-results/
            libs/amethyst/amethyst/build/reports/androidTests/

  aether-client-device:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v7
        with:
          go-version-file: libs/appops-next/daemon/go.mod
          cache: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Build actual Telos and external UI driver
        run: |
          set -o pipefail
          ./gradlew :app:app:assembleDefaultDebug :app:ui:assembleDefaultDebugAndroidTest -Ptelos.abi=x86_64 \
            --no-daemon --max-workers=1 --console=plain -Dorg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' 2>&1 | tee /tmp/aether-client.log
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/validation/aether-client-device.sh
      - name: Publish public-fixture screenshots for review
        if: always()
        shell: bash
        run: |
          if ! find /tmp/aether-screenshots -name '*.png' -print -quit 2>/dev/null | grep -q .; then exit 0; fi
          # Fresh offline emulator, public keys only. No user data or signing keys.
          base="$GITHUB_SHA"
          if git fetch origin refs/heads/codex/aether-ui-evidence:refs/remotes/origin/aether-ui-evidence; then
            base=refs/remotes/origin/aether-ui-evidence
          fi
          git worktree add --detach /tmp/aether-review "$base"
          mkdir -p /tmp/aether-review/docs/screenshots/development/aether
          find /tmp/aether-screenshots -name '*.png' -exec cp {} /tmp/aether-review/docs/screenshots/development/aether/ \;
          printf '%s\n' "$GITHUB_SHA" > /tmp/aether-review/docs/screenshots/development/aether/SOURCE_REVISION
          git -C /tmp/aether-review config user.name github-actions[bot]
          git -C /tmp/aether-review config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/aether-review add docs/screenshots/development/aether
          if ! git -C /tmp/aether-review diff --cached --quiet; then
            git -C /tmp/aether-review commit -qm 'docs: record offline Aether emulator screenshots [skip ci]'
            git -C /tmp/aether-review push origin HEAD:refs/heads/codex/aether-ui-evidence
          fi
      - name: Report client validation details
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/ui/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              print('::notice title=Aether UI tests::' + str(suite.attrib))
              for failure in suite.findall('.//failure'):
                  text = (failure.get('message', '') + '\n' + (failure.text or ''))[:12000]
                  print('::error title=Aether UI failure::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          log = Path('/tmp/aether-client.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              if any('BUILD FAILED' in line for line in lines):
                  text = '\n'.join(lines[-85:])[-18000:]
                  print('::error title=Aether APK driver build::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              for line in lines:
                  if line.startswith('e: '): print('::error title=Aether UI compile::' + line.replace('%', '%25'))
          logcat = Path('/tmp/aether-client-logcat.txt')
          if logcat.exists():
              errors = [line for line in logcat.read_text(errors='replace').splitlines() if 'AndroidRuntime' in line or 'AetherRuntime' in line]
              if errors:
                  text = '\n'.join(errors[-80:])[-18000:]
                  print('::error title=Aether runtime details::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-client-device-results
          if-no-files-found: ignore
          path: |
            /tmp/aether-client.log
            /tmp/aether-client-logcat.txt
            /tmp/aether-screenshots/
            app/ui/build/outputs/androidTest-results/
            app/ui/build/reports/androidTests/

  open-pull-request:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/aether-amethyst-embedded'
    needs: [android-library, telos-apk, aether-storage-device, aether-client-device]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Open review after the integration gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head codex/aether-amethyst-embedded --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Aether PR #$existing already exists"
            exit 0
          fi
          cat > /tmp/aether-pr.md <<'BODY'
          Aether currently opens a preview. This embeds the full Amethyst F-Droid client inside the Telos APK, including multiple accounts, settings, feeds, relay management and messaging. No external Amethyst APK is needed; proprietary Play-only integrations are not shipped.

          The integration defers runtime startup, isolates encrypted account storage from launcher preferences/backups, preserves the keyless WebView sandbox, forwards links and shares into the Telos task, and connects Cybertech settings chrome and separate notification identity. Original MIT notices and the pinned upstream revision are retained.

          Validation covers the real ARM64 debug and R8 release APK builds, library host tests, encrypted storage/notification isolation on Android, and a separate-process driver exercising public-key login, multiple accounts, settings and process restart in the actual Telos APK. Physical Android 17, external signers and live publishing are not established by these tests.
          BODY
          printf '\nValidation run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/aether-pr.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head codex/aether-amethyst-embedded \
            --title 'Embed Amethyst client in Aether with multiple accounts' --body-file /tmp/aether-pr.md
