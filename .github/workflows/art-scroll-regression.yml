name: ART filter scrolling regression
on:
  push:
    branches: ['codex/fix-art-filter-scroll']
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/art/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/TelosSearchBar.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/TelosSharedUi.kt'
      - 'app/ui/src/androidTest/java/de/mm20/launcher2/ui/settings/art/**'
      - '.github/workflows/art-scroll-regression.yml'
  pull_request:
    paths:
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/settings/art/**'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/TelosSearchBar.kt'
      - 'app/ui/src/main/java/de/mm20/launcher2/ui/component/TelosSharedUi.kt'
      - 'app/ui/src/androidTest/java/de/mm20/launcher2/ui/settings/art/**'
      - '.github/workflows/art-scroll-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: art-scroll-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Compile actual UI and regression APK
        run: |
          BUILD_STATUS=0
          bash ./gradlew :app:ui:assembleDefaultDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' --stacktrace --no-configuration-cache > "$RUNNER_TEMP/art-compile.log" 2>&1 || BUILD_STATUS=$?
          cat "$RUNNER_TEMP/art-compile.log"
          if [ "$BUILD_STATUS" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          lines = Path(os.environ['RUNNER_TEMP'], 'art-compile.log').read_text().splitlines()
          errors = [line for line in lines if line.startswith('e:') or 'error:' in line]
          message = chr(10).join(errors or lines[-35:])[:6000]
          message = message.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print('::error title=ART regression compilation::' + message)
          PY
          fi
          exit "$BUILD_STATUS"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:ui:connectedDefaultDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.mm20.launcher2.ui.settings.art.ArtOptimizerScrollTest --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx7g -Dfile.encoding=UTF-8' --stacktrace --no-configuration-cache
      - name: Require both regression cases to execute successfully
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'artFiltersRemainReachableAfterScrollingDown', 'sharedAppFiltersUseTheSameSingleScrollingOwner'}
          executed = set()
          failed = False
          for report in Path('app/ui/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  if case.get('classname') == 'de.mm20.launcher2.ui.settings.art.ArtOptimizerScrollTest':
                      for tag in ('failure', 'error', 'skipped'):
                          problem = case.find(tag)
                          if problem is not None:
                              failed = True
                              message = (problem.text or problem.get('message') or tag)[:6000]
                              message = message.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
                              print('::error title=ART scroll test ' + case.get('name', '') + '::' + message)
                      executed.add(case.get('name'))
          assert expected <= executed, f'Missing or crashed test cases: {expected - executed}'
          assert not failed, 'ART scrolling regression failed or was skipped'
          print('::notice title=ART scroll regression::Both Android regression cases passed, covering Greek labels at font scales 1.0 and 2.0.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: art-scroll-regression-results
          path: |
            app/ui/build/outputs/androidTest-results/
            app/ui/build/reports/androidTests/
          if-no-files-found: warn
