name: Inspect final release job map
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  actions: read
  contents: read
jobs:
  inspect-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read release jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/44347480022/jobs" --jq '.jobs[] | {id, name, status, conclusion, html_url}' > /tmp/release-jobs.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/release-jobs.txt').read_text()
          print('::notice title=Release job map::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
