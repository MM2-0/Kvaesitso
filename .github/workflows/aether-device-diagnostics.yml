name: Inspect Android bundle build interruption
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  actions: read
  contents: read
jobs:
  inspect-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve completed bundle job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/134953701217/logs" --output /tmp/aab.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/aab.log').read_text(errors='replace').splitlines()
          text = '\n'.join(lines[-15:])[-3500:]
          print('::notice title=Bundle interruption details::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Read submitted dependency versions and newly added advisory metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" > /tmp/sbom.json 2>/tmp/sbom-error.txt || true
          gh api "repos/$GITHUB_REPOSITORY/dependency-graph/compare/v1.45.69...v1.45.70" > /tmp/dependency-review.json 2>/tmp/review-error.txt || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('/tmp/sbom.json').read_text())
              packages = data.get('sbom', {}).get('packages', [])
              selected = [{k:p.get(k) for k in ('name', 'versionInfo')} for p in packages if any(x in p.get('name', '').lower() for x in ('freemarker', 'picomatch'))]
              print('::notice title=Submitted dependency graph::' + json.dumps({'packages':len(packages), 'selected':selected}))
          except Exception as e: print('::notice::SBOM read unavailable: ' + str(e))
          try:
              data = json.loads(Path('/tmp/dependency-review.json').read_text())
              if isinstance(data, list):
                  added = [d for d in data if d.get('change_type') == 'added' and d.get('vulnerabilities')]
                  for item in added:
                      text = json.dumps({k:item.get(k) for k in ('name','version','manifest','vulnerabilities')})
                      print('::notice title=Added dependency advisory::' + text.replace('%', '%25')[:3500])
                  print('::notice title=Dependency review totals::' + json.dumps({'changes':len(data),'added_with_advisories':len(added)}))
              else: print('::notice title=Dependency review access::' + json.dumps(data)[:3000])
          except Exception as e: print('::notice::Dependency review unavailable: ' + str(e))
          PY
