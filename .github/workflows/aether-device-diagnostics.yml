name: Check final dependency review and VM download
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review integrated candidate and verify VM download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          path='repos/'+repo+'/dependency-graph/compare/v1.45.69...224a9b99171cdd00fa2724adb03258e0714ffdc6'
          data=json.loads(subprocess.check_output(['gh','api',path],text=True))
          vulnerable=[d for d in data if d.get('change_type')=='added' and d.get('vulnerabilities')]
          print('::notice title=Integrated dependency review::'+json.dumps({'changes':len(data),'added_vulnerable':vulnerable})[:3900])
          if vulnerable:raise SystemExit('Added vulnerable components detected')
          PYCODE
          curl --fail --location --head --retry 2 'https://qemu.weilnetz.de/w64/2026/qemu-w64-setup-20260811.exe'
