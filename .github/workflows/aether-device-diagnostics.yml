name: Hold release for confirmed dependency advisories
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  actions: write
  contents: read
jobs:
  hold-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stop unfinished tag builds while confirmed advisories are fixed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 44347480022 44347480247 44347482239; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)
            if [ "$status" != completed ]; then gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel"; fi
          done
          echo '::notice::Held unpublished release for confirmed included-build dependency advisories'
