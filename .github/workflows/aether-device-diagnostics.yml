name: Stop redundant Aether validation after passing main gates
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  actions: write
  contents: read
jobs:
  stop-redundant-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm passing validation and stop duplicate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44336725713" --jq .conclusion)
          test "$conclusion" = success
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44340452492" --jq .status)
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/44340452492/cancel"
            echo '::notice::Stopped redundant validation; all main Aether gates passed on the same application source'
          fi
