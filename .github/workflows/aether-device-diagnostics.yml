name: Retry Aether emulator infrastructure failure
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  actions: write
  contents: read
jobs:
  retry-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Retry only the failed real-APK emulator job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44336725713/jobs" --jq '.jobs[] | select(.name == "aether-client-device" and .conclusion == "failure") | .id')
          test -n "$job"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/jobs/$job/rerun"
          echo "::notice::Retried Aether client job $job after Pixel Launcher emulator ANR"
