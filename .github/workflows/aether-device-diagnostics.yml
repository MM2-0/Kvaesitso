name: Read open dependency alerts before Aether release
on:
  push:
    branches: ['codex/aether-diagnostics']
permissions:
  contents: read
  security-events: read
jobs:
  inspect-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read actionable dependency advisory metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --paginate "repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open&per_page=100" --jq '.[] | {severity: .security_advisory.severity, advisory: .security_advisory.ghsa_id, package: .dependency.package.name, manifest: .dependency.manifest_path, vulnerable: .security_vulnerability.vulnerable_version_range, patched: .security_vulnerability.first_patched_version.identifier}' > /tmp/alerts.txt 2>/tmp/alerts-error.txt; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/alerts.txt').read_text()
          print('::notice title=Open dependency advisories::' + (text or 'No open alerts').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          else
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/alerts-error.txt').read_text(errors='replace')
          print('::warning title=Dependency alert access::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
