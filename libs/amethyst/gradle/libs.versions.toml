[versions]
# Amethyst app version — single source of truth consumed by both Android (amethyst/)
# and Desktop (desktopApp/). `appCode` is the Android versionCode: a monotonic
# integer that must increment on every release, even when `app` is unchanged.
app = "1.21.0"
appCode = "466"
accompanistAdaptive = "0.37.3"
# Pinned: 0.3.0 turns CacheMap.entries/keys/values into DeprecationLevel.ERROR (and
# throws UnsupportedOperationException at runtime), which breaks quartz's appleMain
# LargeCache/ConcurrentHashCache — they read those views directly and through the
# stdlib Map operators (filter/map/groupBy/associate/count). Bumping needs a port to
# the new forEach/forEachKey/forEachValue API, verified on an Apple target.
composeMultiplatform = "1.12.2"
activityCompose = "1.13.0"
# 9.4.0's PerModuleBundleTask rejects an AAB entry whose name contains a colon, which every
# .kotlin_module named after a Gradle project path has. Worked around in amethyst/build.gradle.kts
# (stripColonNamedEntries) rather than by pinning to 9.3.1; drop that block if AGP fixes it.
agp = "9.5.1"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidxJunit = "1.3.0"
appcompat = "1.8.0"
audiowaveform = "1.1.2"
benchmark = "1.5.0"
uiautomator = "2.4.0"
biometricKtx = "1.4.0-alpha02"
coil = "3.6.3"
composeBom = "2026.09.00"
tracingPerfetto = "1.0.1"
coreKtx = "1.19.1"
datastore = "1.3.0"
espressoCore = "3.7.0"
firebaseBom = "35.1.0"
fragmentKtx = "1.9.1"
gms = "4.5.0"
healthConnect = "1.1.0"
jackson = "2.22.4"
jacksonModuleKotlin = "2.22.4"
snakeyaml = "2.7"
jna = "5.19.1"
# Chromium (JCEF) for the desktop napplet host. jcefmaven is Apache-2.0; JCEF and CEF are BSD-3;
# the native bundle it downloads on first use is Chromium, whose libcef.so includes FFmpeg (LGPL-2.1).
jcefmaven = "152.0.6"
# Hunspell spell checking for the desktop composers (pure Java, Apache-2.0).
lucene = "10.6.0"
javaKeyring = "1.0.4"
