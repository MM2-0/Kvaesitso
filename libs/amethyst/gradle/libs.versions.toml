genaiPrompt = "1.0.0-beta5"
genaiRewriting = "1.0.0-beta1"
genaiImageDescription = "1.0.0-beta1"
languageId = "17.0.6"
lifecycleRuntimeKtx = "2.11.0"
lightcompressor-enhanced = "2.4.0"
jlatexmath = "1.5"
markdown = "4d3b3dd173"
# What richtext-commonmark parses with, and the URL finder its autolink extension uses.
# Keep in step with what those resolve to.
commonmark = "0.26.0"
autolink = "0.12.0"
highlights = "1.1.0"
okio = "3.18.2"
# JetBrains material3 must track Compose Multiplatform's foundation: CMP 1.12.0 changed
# the CustomStyle.applyStyle signature, so the stable 1.9.0 (and the 1.11.0-alpha07 that
# kodein-emoji pulls in) crash at runtime with AbstractMethodError in OutlinedTextField.
# 1.12.0-alpha03 is the first release built against foundation 1.12.x. Android keeps taking
# androidx material3 from composeBom; this ref only drives desktop/iOS.
material3 = "1.12.0-alpha03"
media3 = "1.11.1"
mockk = "1.14.11"
kotlinx-coroutines-test = "1.11.0"
# The Nostr protocol library, split out of this repo into vitorpamplona/quartz.
# 2.13.0 reads and writes drss.io's listening progress as kind 30078 (DrssListenProgressAppDataEvent),
# where drss moved it from 30054.
quartzKmp = "2.17.0"
# A quartz commit built by JitPack, used in place of the release above while Maven Central lacks it
# (Central refused 2.17.0's upload for the month's release-size limit, which resets 2026-12-01).
# Now: quartz main at vitorpamplona/quartz#110, on top of 2.17.0: the NIP-34 work, JVM bytecode target
# 21, which every module here already targets, secp256k1 from libschnorr256k1-kotlin, also from JitPack
# until it is on Maven Central, the Cashu nutzap-redeem fixes, and the trust network keyed by the whole
# pubkey, not its first 128 bits, which let a made-up lookalike key take a real person's score. Quartz
# main's jitpack.yml now also builds the iOS variants the metadata compiles need, so the pin is a plain
# main commit. The root build swaps every quartz dependency for it, the bindings' included. Empty: the
# release. -PquartzDir=../quartz still wins.
quartzJitpack = "009e4c8dcb23578638f10f66ebc42c04ebaf0c88"
# The two MLS bindings, split out of quartz into their own libraries: Marmot (vitorpamplona/marmot-kmp)
# and cordn (vitorpamplona/cordn-kmp). Their current releases were built against quartz 2.7.3 and run on
# the version above: 2.9.0 removed no public API they use.
marmotKmp = "2.2.1"
cordnKmp = "1.2.1"
# Crypto primitives (vitorpamplona/crypto-kmp) come with quartz, the MLS engine (vitorpamplona/mls-kmp)
# with marmot and cordn; commons also declares them because it imports them directly. Keep them at the
# versions those libraries were built against.
cryptoKmp = "2.1.0"
# The fantasy-console cart runtime behind the note cart player (vitorpamplona/kiko-kmp): kiko runs a
# cart, kiko-player plays it in real time (commons), kiko-compose shows it (commonsUI).
kikoKmp = "0.2.4"
mlsKmp = "1.3.0"
# Pure-Kotlin QUIC v1 + HTTP/3 + WebTransport, split out of this repo into vitorpamplona/quic-kmp.
quicKmp = "1.2.0"
# Navigation 3, the Compose Multiplatform build (Apache-2.0): Android, desktop and iOS. The
# ViewModel decorator scopes each back-stack entry's ViewModels; match it to the lifecycle version.
navigation3 = "1.2.0"
# What navigation3-ui 1.2.0 resolves to; commonsUI skikoMain uses it directly for PlatformBackHandler.
jetbrainsNavigationevent = "1.1.0"
lifecycleNavigation3 = "2.11.0"
okhttp = "5.5.1"
jsoup = "1.21.1"
osmdroid = "6.1.20"
runner = "1.7.0"
# The JNI bindings must match the secp256k1-kmp version quartz is built against (its secp256k1Kmp).
secp256k1KmpJniAndroid = "0.24.0"
schnorr256k1Kmp = "1.0.5"
securityCryptoKtx = "1.1.0"
slf4j = "2.0.20"
sonarqubeGradlePlugin = "7.5.0.8588"
spotless = "8.10.4"
streamWebrtcAndroid = "1.3.10"
translate = "17.0.3"
jetbrainsCompose = "1.12.2"
unifiedpush = "3.0.10"
playServicesCast = "23.0.0"
vico-charts-compose = "3.3.1"
zelory = "3.0.1"
pdfbox = "3.0.8"
zoomable = "2.16.0"
composemediaplayer = "0.11.4"
jcodec = "0.2.5"
commonsImaging = "1.0.0-alpha6"
thumbnailator = "0.4.21"
zxing = "3.5.4"
webkit = "1.18.0"
# Cross-process UI embedding (SurfaceControlViewHost wrapper) for the in-app browser surface. Apache-2.0.
privacysandboxUi = "1.0.0-alpha17"
windowCoreAndroid = "1.5.1"
workRuntime = "2.12.0"
androidxCamera = "1.6.2"
androidxCollection = "1.7.0"
androidxProfileinstaller = "1.4.1"
androidxExifinterface = "1.4.2"
kotlinTest = "2.4.21"
core = "1.7.0"
sqlite = "2.7.1"
